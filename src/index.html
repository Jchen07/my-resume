<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Jie Chen - Web developer and programmer</title>
    <meta
      name="description"
      content="Jie Chen is a full-stack web developer and programmer specializing in Angular, Java, and modern web technologies. Explore projects, experience, and skills in enterprise web application development, UI/UX, and cloud solutions. Contact for collaboration or job opportunities." />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      const theme = localStorage.getItem('theme');
      const browserDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (theme !== null) {
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } else if (browserDark) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body class="bg-term-bg text-term-fg min-h-screen w-full font-sans antialiased">
    <jc-root></jc-root>
  </body>
</html>
