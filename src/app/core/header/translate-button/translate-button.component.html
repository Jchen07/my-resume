<div class="relative">
  <button
    type="button"
    class="border-term-border text-term-fg hover:border-term-faint flex cursor-pointer items-center gap-1.5 rounded border px-2 py-1.5 font-mono text-xs transition"
    [attr.aria-label]="'header.translate-button' | transloco"
    (click)="openDialog()">
    {{ activeLabel() }}
    <svg
      xmlns="http://www.w3.org/2000/svg"
      height="11"
      width="11"
      viewBox="0 0 16 16"
      fill="none"
      stroke="currentColor"
      stroke-width="1.6"
      stroke-linecap="round"
      class="text-term-muted">
      <path d="m4 6 4 4 4-4" />
    </svg>
  </button>
  @if (menuVisible()) {
    <div
      class="border-term-border bg-term-panel absolute top-9 right-0 z-50 mt-1 origin-top-right rounded-md border p-1 font-mono text-xs shadow-lg"
      jcClickOutside
      (clickedOutside)="hideMenu()">
      <ul>
        @for (language of languages | keyvalue; track language.key) {
          <li
            class="text-term-muted hover:bg-term-tag-bg hover:text-term-fg flex w-28 cursor-pointer items-center rounded px-2.5 py-1.5 transition"
            tabindex="0"
            jcClickEnterSpacebar
            (clickedOrEnterOrSpaceBar)="changeLanguage(language.key)">
            {{ language.value }}
          </li>
        }
      </ul>
    </div>
  }
</div>
