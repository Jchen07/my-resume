<nav *transloco="let t; prefix: 'header.navbar'" class="flex items-center">
  <ul class="flex flex-row items-center gap-5 font-mono text-[12.5px] lowercase">
    <li>
      <a
        jcOpenLinkConfirmation
        class="text-term-muted hover:text-term-fg flex cursor-pointer items-center transition"
        target="_blank"
        role="link"
        rel="noopener noreferrer"
        aria-label="Open Github"
        href="https://github.com/Jchen07">
        <fa-icon [icon]="['fab', 'github']" class="select-none" />
      </a>
    </li>
    @for (option of options; track option.labelkey) {
      <li tabindex="0" [attr.aria-label]="t(option.labelkey)">
        @if (option.extern) {
          <a
            jcOpenLinkConfirmation
            class="text-term-muted hover:text-term-fg cursor-pointer transition"
            role="link"
            rel="noopener noreferrer"
            [href]="option.href">
            {{ t(option.labelkey) }}
          </a>
          <fa-icon
            class="text-term-muted hover:text-term-fg ml-1 cursor-pointer transition"
            [icon]="['fas', 'copy']"
            [title]="t('copyEmailToClipboard')"
            [attr.aria-label]="t('copyEmailToClipboard')"
            (click)="copyEmailToClipboard()" />
        } @else {
          <a
            role="link"
            class="text-term-muted hover:text-term-fg cursor-pointer transition"
            [href]="option.href">
            {{ t(option.labelkey) }}
          </a>
        }
      </li>
    }
  </ul>
</nav>
