<form
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  class="w-full space-y-6 rounded-lg bg-white p-6 shadow sm:w-1/2 md:w-1/3 dark:bg-neutral-900">
  <h2 class="mb-4 text-2xl font-bold text-gray-800 dark:text-gray-100">Contact Me</h2>

  <div>
    <label for="name" class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-200">
      Name
    </label>
    <input
      id="name"
      name="name"
      formControlName="name"
      type="text"
      class="w-full rounded border border-gray-300 bg-gray-100 px-3 py-2 text-gray-900 focus:ring-2 focus:ring-purple-500 focus:outline-none dark:border-gray-700 dark:bg-gray-800 dark:text-gray-100" />
  </div>

  <div>
    <label for="email" class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-200">
      Email
    </label>
    <input
      id="email"
      name="email"
      formControlName="email"
      type="email"
      class="w-full rounded border border-gray-300 bg-gray-100 px-3 py-2 text-gray-900 focus:ring-2 focus:ring-purple-500 focus:outline-none dark:border-gray-700 dark:bg-gray-800 dark:text-gray-100" />
  </div>

  <div>
    <label for="message" class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-200">
      Message
    </label>
    <textarea
      id="message"
      name="message"
      formControlName="message"
      rows="4"
      class="w-full rounded border border-gray-300 bg-gray-100 px-3 py-2 text-gray-900 focus:ring-2 focus:ring-purple-500 focus:outline-none dark:border-gray-700 dark:bg-gray-800 dark:text-gray-100"></textarea>
  </div>

  <button
    type="submit"
    class="w-full rounded bg-purple-700 px-4 py-2 font-semibold text-white transition-colors hover:bg-purple-800">
    Send Message
  </button>
</form>
