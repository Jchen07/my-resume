<section
  *transloco="let t; prefix: 'home.education'"
  id="education"
  [attr.aria-label]="t('title')"
  class="w-full scroll-mt-24">
  <h2 class="text-term-accent font-mono text-xs tracking-[0.22em] uppercase">
    [ {{ t('title') }} ]
  </h2>
  <div class="bg-term-border mt-2 mb-5 h-px"></div>
  <jc-timeline [timeLines]="timeLines()" />
</section>
